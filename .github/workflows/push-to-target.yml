name: Push to Target Repository

# Trigger on push to main/master branch or manual dispatch
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to push'
        required: false
        default: 'main'

jobs:
  push-to-target:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper sync
          
      - name: Setup Git configuration
        run: |
          git config user.name "rochiyat"
          git config user.email "rochiyat@gmail.com"
          
      - name: Push to target repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          # Set target repository URL with token
          TARGET_REPO="https://rochiyat:${TARGET_TOKEN}@github.com/rochiyat-tech/image-optimizer.git"
          
          # Get current branch name
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Push to target repository
          echo "Pushing branch ${BRANCH_NAME} to target repository..."
          git push "${TARGET_REPO}" HEAD:${BRANCH_NAME} --force
          
          echo "✅ Successfully pushed to rochiyat-tech/image-optimizer"
          
      - name: Push tags (if any)
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          TARGET_REPO="https://rochiyat:${TARGET_TOKEN}@github.com/rochiyat-tech/image-optimizer.git"
          
          # Push all tags
          if [ -n "$(git tag)" ]; then
            echo "Pushing tags..."
            git push "${TARGET_REPO}" --tags --force
            echo "✅ Tags pushed successfully"
          else
            echo "No tags to push"
          fi
        continue-on-error: true
        
      - name: Summary
        if: success()
        run: |
          echo "## 🚀 Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully synced to **rochiyat-tech/image-optimizer**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on target repo](https://github.com/rochiyat-tech/image-optimizer)" >> $GITHUB_STEP_SUMMARY
